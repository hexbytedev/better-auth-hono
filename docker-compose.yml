name: local
services:
  # One-shot: syncs the schema into the database with `push`, then exits.
  # Same image as the app, invoked with the `push` command. The app waits
  # for it to complete.
  better-auth-hono-migrate:
    image: ghcr.io/hexbytedev/better-auth-hono:latest
    container_name: better-auth-hono-migrate
    command: ['push']
    restart: 'no'
    env_file:
      - .env.local
  better-auth-hono:
    image: ghcr.io/hexbytedev/better-auth-hono:latest
    container_name: better-auth-hono
    command: ['app']
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - '172.17.0.1:8558:8558'
    depends_on:
      better-auth-hono-migrate:
        condition: service_completed_successfully
